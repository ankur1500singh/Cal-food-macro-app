<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMacro - Calorie Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { 
            width: 100%;
            max-width: 500px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }
        .card.active {
            display: block;
        }
        h1 { 
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1a1a1a;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
        }
        input[type="range"] {
            width: 100%;
            margin-bottom: 15px;
        }
        .food-item {
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .food-item:hover {
            background: #f0f0f0;
        }
        .food-name {
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .food-cal {
            font-size: 12px;
            color: #999;
        }
        .macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .macro-box {
            background: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .macro-box.carbs {
            background: #e8f5e9;
        }
        .macro-box.fat {
            background: #fce4ec;
        }
        .macro-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        .macro-value {
            font-size: 20px;
            font-weight: bold;
            color: #f57c00;
        }
        .macro-box.carbs .macro-value {
            color: #2e7d32;
        }
        .macro-box.fat .macro-value {
            color: #c2185b;
        }
        .calorie-big {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        .calorie-big-label {
            font-size: 13px;
            opacity: 0.9;
        }
        .calorie-big-num {
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
        }
        .servings-label {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            margin-bottom: 8px;
        }
        .servings-value {
            color: #667eea;
        }
        .button-row {
            display: flex;
            gap: 10px;
        }
        .button-row button {
            flex: 1;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HOME SCREEN -->
        <div id="homeScreen" class="card active">
            <h1>🍔 FoodMacro</h1>
            <p class="subtitle">Instant calorie & macro tracking</p>
            <button class="btn-primary" onclick="goToSearch()">🔍 Search for food</button>
        </div>

        <!-- SEARCH SCREEN -->
        <div id="searchScreen" class="card">
            <h1>Search Food</h1>
            <div style="margin-bottom: 15px;">
                <input type="text" id="searchInput" placeholder="e.g. chicken, banana, rice...">
                <button class="btn-primary" onclick="searchFood()">Search</button>
            </div>
            <button class="btn-secondary" onclick="goHome()">Back to home</button>
        </div>

        <!-- RESULTS SCREEN -->
        <div id="resultsScreen" class="card">
            <h1>Select a food</h1>
            <div id="foodList" style="max-height: 60vh; overflow-y: auto; margin-bottom: 15px;"></div>
            <button class="btn-secondary" onclick="goToSearch()">Back to search</button>
        </div>

        <!-- NUTRITION SCREEN -->
        <div id="nutritionScreen" class="card">
            <h1 id="foodTitle">Food</h1>
            <p class="subtitle">Per serving</p>

            <div style="margin-bottom: 20px;">
                <div class="servings-label">Servings: <span class="servings-value" id="servingsDisplay">1</span></div>
                <input type="range" id="servingsSlider" min="0.25" max="5" step="0.25" value="1" onchange="updateMacros()">
            </div>

            <div class="calorie-big">
                <div class="calorie-big-label">Total Calories</div>
                <div class="calorie-big-num" id="totalCalories">0</div>
            </div>

            <div class="macro-grid">
                <div class="macro-box">
                    <div class="macro-label">Protein</div>
                    <div class="macro-value" id="proteinValue">0g</div>
                </div>
                <div class="macro-box carbs">
                    <div class="macro-label">Carbs</div>
                    <div class="macro-value" id="carbsValue">0g</div>
                </div>
                <div class="macro-box fat">
                    <div class="macro-label">Fat</div>
                    <div class="macro-value" id="fatValue">0g</div>
                </div>
            </div>

            <div class="button-row">
                <button class="btn-secondary" onclick="goToSearch()">Search again</button>
                <button class="btn-primary" onclick="goHome()">Home</button>
            </div>
        </div>
    </div>

    <script>
        let selectedFood = null;
        let foodResults = [];

        function showScreen(screenId) {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() {
            showScreen('homeScreen');
        }

        function goToSearch() {
            document.getElementById('searchInput').value = '';
            showScreen('searchScreen');
        }

        function searchFood() {
            const query = document.getElementById('searchInput').value;
            if (!query.trim()) {
                alert('Please enter a food name');
                return;
            }

            // Mock food database for demo
            const mockFoods = {
                'chicken': [
                    { food_name: 'Grilled Chicken Breast', nf_calories: 165, nf_protein: 31, nf_total_carbohydrate: 0, nf_total_fat: 3.6 },
                    { food_name: 'Fried Chicken', nf_calories: 320, nf_protein: 30, nf_total_carbohydrate: 11, nf_total_fat: 17 }
                ],
                'banana': [
                    { food_name: 'Banana (medium)', nf_calories: 105, nf_protein: 1.3, nf_total_carbohydrate: 27, nf_total_fat: 0.3 }
                ],
                'rice': [
                    { food_name: 'White Rice (cooked)', nf_calories: 130, nf_protein: 2.7, nf_total_carbohydrate: 28, nf_total_fat: 0.3 },
                    { food_name: 'Brown Rice (cooked)', nf_calories: 111, nf_protein: 2.6, nf_total_carbohydrate: 23, nf_total_fat: 0.9 }
                ],
                'apple': [
                    { food_name: 'Apple (medium)', nf_calories: 95, nf_protein: 0.5, nf_total_carbohydrate: 25, nf_total_fat: 0.3 }
                ],
                'egg': [
                    { food_name: 'Egg (large, boiled)', nf_calories: 78, nf_protein: 6.3, nf_total_carbohydrate: 0.6, nf_total_fat: 5.3 }
                ],
                'bread': [
                    { food_name: 'Bread (1 slice white)', nf_calories: 80, nf_protein: 2, nf_total_carbohydrate: 14, nf_total_fat: 1 }
                ],
                'milk': [
                    { food_name: 'Milk (1 cup, 2%)', nf_calories: 122, nf_protein: 8.1, nf_total_carbohydrate: 12, nf_total_fat: 4.8 }
                ]
            };

            // Search in mock database
            const searchLower = query.toLowerCase();
            let results = [];
            
            for (let key in mockFoods) {
                if (key.includes(searchLower)) {
                    results = mockFoods[key];
                    break;
                }
            }

            if (results.length === 0) {
                alert('Food not found in our database. Try: chicken, banana, rice, apple, egg, bread, milk');
                return;
            }

            foodResults = results;
            displayResults();
            showScreen('resultsScreen');
        }

        function displayResults() {
            const foodList = document.getElementById('foodList');
            foodList.innerHTML = '';
            
            foodResults.forEach(food => {
                const div = document.createElement('div');
                div.className = 'food-item';
                div.onclick = () => selectFood(food);
                div.innerHTML = `
                    <div class="food-name">${food.food_name}</div>
                    <div class="food-cal">${Math.round(food.nf_calories)} cal</div>
                `;
                foodList.appendChild(div);
            });
        }

        function selectFood(food) {
            selectedFood = food;
            document.getElementById('foodTitle').textContent = food.food_name;
            document.getElementById('servingsSlider').value = 1;
            document.getElementById('servingsDisplay').textContent = '1';
            updateMacros();
            showScreen('nutritionScreen');
        }

        function updateMacros() {
            if (!selectedFood) return;
            
            const servings = parseFloat(document.getElementById('servingsSlider').value);
            document.getElementById('servingsDisplay').textContent = servings;
            
            const calories = Math.round((selectedFood.nf_calories || 0) * servings);
            const protein = Math.round((selectedFood.nf_protein || 0) * servings * 10) / 10;
            const carbs = Math.round((selectedFood.nf_total_carbohydrate || 0) * servings * 10) / 10;
            const fat = Math.round((selectedFood.nf_total_fat || 0) * servings * 10) / 10;
            
            document.getElementById('totalCalories').textContent = calories;
            document.getElementById('proteinValue').textContent = protein + 'g';
            document.getElementById('carbsValue').textContent = carbs + 'g';
            document.getElementById('fatValue').textContent = fat + 'g';
        }

        // Allow Enter key to search
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchFood();
                }
            });
        });
    </script>
</body>
</html>
