<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMacro - Calorie & Macro Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .container { width: 100%; max-width: 500px; }
        .card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 0.5rem; color: #1a1a1a; }
        p { font-size: 14px; color: #666; margin-bottom: 2rem; }
        button { width: 100%; padding: 1rem; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 1rem; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; margin-bottom: 1rem; }
        .food-item { padding: 1rem; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 0.75rem; cursor: pointer; text-align: left; }
        .food-item:hover { background: #f0f0f0; }
        .food-name { font-weight: 600; color: #1a1a1a; margin-bottom: 0.25rem; }
        .food-cal { font-size: 12px; color: #999; }
        .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin: 1.5rem 0; }
        .macro-box { background: #fff3e0; padding: 1rem; border-radius: 8px; text-align: center; }
        .macro-box.carbs { background: #e8f5e9; }
        .macro-box.fat { background: #fce4ec; }
        .macro-label { font-size: 12px; color: #666; margin-bottom: 0.5rem; }
        .macro-value { font-size: 20px; font-weight: 700; color: #f57c00; }
        .macro-box.carbs .macro-value { color: #2e7d32; }
        .macro-box.fat .macro-value { color: #c2185b; }
        .video-container { position: relative; background: #000; height: 300px; margin-bottom: 1rem; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .close-btn { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 20px; font-weight: bold; }
        .calorie-big { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1.25rem; border-radius: 12px; text-align: center; margin-bottom: 1rem; }
        .calorie-big-num { font-size: 32px; font-weight: 700; margin-top: 0.5rem; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .per-serving { background: #f0f0f0; padding: 1.25rem; border-radius: 12px; text-align: center; }
        .per-serving-num { font-size: 18px; font-weight: 600; color: #333; margin-top: 0.5rem; }
        .button-row { display: flex; gap: 0.75rem; }
        .button-row button { flex: 1; margin-bottom: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function FoodMacroApp() {
            const [screen, setScreen] = useState('home');
            const [foodResults, setFoodResults] = useState([]);
            const [selectedFood, setSelectedFood] = useState(null);
            const [servings, setServings] = useState(1);
            const [loading, setLoading] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const videoRef = useRef(null);

            const searchFood = async (query) => {
                if (!query.trim()) return;
                setLoading(true);
                
                try {
                    const response = await fetch(
                        `https://www.nutritionix.com/search/instant?q=${encodeURIComponent(query)}&v2=true`,
                        {
                            headers: {
                                'x-app-id': 'a96df86c',
                                'x-app-key': 'cd0a97a2ed02a4dffff3f7c6a0b3d5e0'
                            }
                        }
                    );
                    
                    const data = await response.json();
                    let results = [];
                    
                    if (data.branded && data.branded.length > 0) {
                        results = data.branded.slice(0, 8);
                    } else if (data.common && data.common.length > 0) {
                        results = data.common.slice(0, 8);
                    }
                    
                    if (results.length > 0) {
                        setFoodResults(results);
                        setScreen('results');
                    } else {
                        alert('No foods found. Try a different search.');
                    }
                } catch (err) {
                    alert('Error searching. Try again.');
                }
                setLoading(false);
            };

            const openCamera = async () => {
                setScreen('camera');
                setTimeout(async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment' } 
                        });
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                    } catch (err) {
                        alert('Camera access denied. Use search instead.');
                        setScreen('home');
                    }
                }, 100);
            };

            const stopCamera = () => {
                const stream = videoRef.current?.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            };

            const getTotals = () => {
                if (!selectedFood) return { calories: 0, protein: 0, carbs: 0, fat: 0 };
                return {
                    calories: Math.round((selectedFood.nf_calories || 0) * servings),
                    protein: Math.round((selectedFood.nf_protein || 0) * servings * 10) / 10,
                    carbs: Math.round((selectedFood.nf_total_carbohydrate || 0) * servings * 10) / 10,
                    fat: Math.round((selectedFood.nf_total_fat || 0) * servings * 10) / 10,
                };
            };

            const totals = getTotals();

            return (
                <div className="container">
                    {/* HOME SCREEN */}
                    {screen === 'home' && (
                        <div className="card" style={{ textAlign: 'center' }}>
                            <h1>🍔 FoodMacro</h1>
                            <p>Instant calorie & macro tracking</p>
                            <button className="btn-primary" onClick={openCamera}>📷 Take a photo</button>
                            <button className="btn-secondary" onClick={() => setScreen('search')}>🔍 Search for food</button>
                        </div>
                    )}

                    {/* CAMERA SCREEN */}
                    {screen === 'camera' && (
                        <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
                            <div className="video-container">
                                <video ref={videoRef} autoPlay playsInline />
                                <button className="close-btn" onClick={() => { stopCamera(); setScreen('home'); }}>✕</button>
                            </div>
                            <div style={{ padding: '1.5rem', display: 'flex', gap: '1rem' }}>
                                <button className="btn-primary" onClick={() => { stopCamera(); setScreen('search'); }}>Capture & Search</button>
                                <button className="btn-secondary" onClick={() => { stopCamera(); setScreen('home'); }}>Cancel</button>
                            </div>
                        </div>
                    )}

                    {/* SEARCH SCREEN */}
                    {screen === 'search' && (
                        <div className="card">
                            <div style={{ display: 'flex', gap: '0.75rem', marginBottom: '1.5rem' }}>
                                <input
                                    type="text"
                                    placeholder="e.g. chicken, banana, rice..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && searchFood(searchQuery)}
                                    style={{ marginBottom: 0 }}
                                />
                                <button className="btn-primary" onClick={() => searchFood(searchQuery)} disabled={loading} style={{ width: '60px', marginBottom: 0 }}>
                                    {loading ? '...' : '🔍'}
                                </button>
                            </div>
                            <button className="btn-secondary" onClick={() => setScreen('home')}>Back to home</button>
                        </div>
                    )}

                    {/* RESULTS SCREEN */}
                    {screen === 'results' && !selectedFood && (
                        <div className="card" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
                            <h2 style={{ fontSize: '18px', fontWeight: '600', marginBottom: '1rem', color: '#1a1a1a' }}>Select a food</h2>
                            {foodResults.map((food, idx) => (
                                <div key={idx} className="food-item" onClick={() => setSelectedFood(food)}>
                                    <div className="food-name">{food.food_name || food.item_name || 'Unknown'}</div>
                                    <div className="food-cal">{Math.round(food.nf_calories || 0)} cal</div>
                                </div>
                            ))}
                            <button className="btn-secondary" onClick={() => setScreen('search')} style={{ marginTop: '1rem' }}>Back to search</button>
                        </div>
                    )}

                    {/* NUTRITION RESULTS */}
                    {selectedFood && (
                        <div className="card">
                            <h2 style={{ fontSize: '20px', fontWeight: '700', marginBottom: '0.5rem', color: '#1a1a1a', textTransform: 'capitalize' }}>
                                {selectedFood.food_name || selectedFood.item_name || 'Food'}
                            </h2>
                            <p style={{ marginBottom: '1.5rem' }}>Per serving</p>

                            <div style={{ marginBottom: '1.5rem' }}>
                                <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#666', marginBottom: '0.5rem' }}>
                                    Servings: <strong style={{ color: '#667eea' }}>{servings}</strong>
                                </label>
                                <input type="range" min="0.25" max="5" step="0.25" value={servings} onChange={(e) => setServings(parseFloat(e.target.value))} style={{ marginBottom: 0 }} />
                            </div>

                            <div className="two-col">
                                <div className="calorie-big">
                                    <div style={{ fontSize: '13px', opacity: 0.9 }}>Calories</div>
                                    <div className="calorie-big-num">{totals.calories}</div>
                                </div>
                                <div className="per-serving">
                                    <div style={{ fontSize: '13px', color: '#666' }}>Per serving</div>
                                    <div className="per-serving-num">{Math.round(selectedFood.nf_calories || 0)}</div>
                                </div>
                            </div>

                            <div className="macro-grid">
                                <div className="macro-box">
                                    <div className="macro-label">Protein</div>
                                    <div className="macro-value">{totals.protein}g</div>
                                </div>
                                <div className="macro-box carbs">
                                    <div className="macro-label">Carbs</div>
                                    <div className="macro-value">{totals.carbs}g</div>
                                </div>
                                <div className="macro-box fat">
                                    <div className="macro-label">Fat</div>
                                    <div className="macro-value">{totals.fat}g</div>
                                </div>
                            </div>

                            <div className="button-row">
                                <button className="btn-secondary" onClick={() => { setSelectedFood(null); setScreen('search'); setSearchQuery(''); }}>Search again</button>
                                <button className="btn-primary" onClick={() => setScreen('home')}>Home</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<FoodMacroApp />, document.getElementById('root'));
    </script>
</body>
</html>
